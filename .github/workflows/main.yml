name: Build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract project zip
        run: |
          if [ -f pom.xml ]; then
            echo "pom.xml already in repo root, no zip to extract"
            echo "PROJECT_DIR=." >> "$GITHUB_ENV"
          else
            ZIP=$(ls -1 *.zip 2>/dev/null | head -n 1)
            if [ -z "$ZIP" ]; then
              echo "::error::No pom.xml and no .zip found in the repo root"
              exit 1
            fi
            echo "Extracting $ZIP"
            mkdir -p extracted
            unzip -q -o "$ZIP" -d extracted
            POM=$(find extracted -name pom.xml -not -path "*/node_modules/*" | head -n 1)
            if [ -z "$POM" ]; then
              echo "::error::No pom.xml inside $ZIP"
              exit 1
            fi
            echo "PROJECT_DIR=$(dirname "$POM")" >> "$GITHUB_ENV"
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: |
            pom.xml
            extracted/**/pom.xml

      - name: Build
        run: mvn -B -f "$PROJECT_DIR/pom.xml" package

      - uses: actions/upload-artifact@v4
        with:
          name: CaneIslands
          path: ${{ env.PROJECT_DIR }}/target/CaneIslands.jar
          if-no-files-found: error
